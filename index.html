<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avioane Online</title>
  
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230284c7'%3E%3Cpath d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

  <!-- ECRAN PRINCIPAL -->
  <div id="welcome-screen">
    <div class="brand-header">
      <h1 class="main-title">AVIOANE</h1>
      <svg class="plane-icon" viewBox="0 0 24 24" fill="none" stroke="#253858" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </div>
    
    <p class="author-subtitle">IG: <a href="https://instagram.com/diminesq" target="_blank" rel="noopener noreferrer">DIMINESQ</a></p>

    <div class="login-form">
      <div class="input-group">
        <label for="usernameInput">USERNAME:</label>
        <input type="text" id="usernameInput" placeholder="Introduceți numele dumneavoastră" maxlength="15" autocomplete="off">
      </div>

      <div class="input-group">
        <label for="roomIdInput">CODE:</label>
        <div class="code-row">
          <input type="text" id="roomIdInput" placeholder="Introduceți sau generați cod" maxlength="15" autocomplete="off">
          <button type="button" id="inviteBtn" onclick="generateAndCopyInvite()" title="Generează cod și copiază link-ul">Invite 🔗</button>
        </div>
      </div>

      <button id="playBtn" onclick="handlePlay()">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="#253858" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span>PLAY</span>
      </button>
    </div>
  </div>

  <!-- STATUS SI CONTROALE -->
  <div id="status-bar" class="hidden">
    <span id="status-text">Așază-ți cele 3 avioane pe tabla din stânga... (Apasă tasta <b>R</b> pentru rotire)</span>
    <div id="controls">
      <button id="rotateBtn" onclick="rotatePlane()">Rotește Avionul [R] (<span id="dir-name">SUS</span>)</button>
      <button id="readyBtn" onclick="confirmReady()" disabled>Gata de Luptă (0/3)</button>
    </div>
  </div>

  <!-- BANNER DE FINAL DE JOC -->
  <div id="game-over-banner" class="hidden">
    <h2 id="game-over-title">Felicitări, ai câștigat!</h2>
    <p id="game-over-desc">Apasă pe butonul de mai jos pentru o revanșă cu același cod.</p>
    <button id="playAgainBtn" onclick="playAgain()">Play again</button>
  </div>

  <!-- ECRANELE DE JOC -->
  <div id="game-container" class="hidden">
    <div class="board-wrapper">
      <h2>Baza Ta (<span id="boardPlayerName">Tu</span>)</h2>
      <div id="my-board" class="grid"></div>
    </div>

    <div class="board-wrapper">
      <h2>Radar Inamic (<span id="boardOpponentName">Așteptare adversar...</span>)</h2>
      <div id="enemy-board" class="grid"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
